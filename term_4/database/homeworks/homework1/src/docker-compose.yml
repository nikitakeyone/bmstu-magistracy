version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./app/public:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  app:
    build: ./docker/php
    volumes:
      - ./app:/var/www
    working_dir: /var/www
    depends_on:
      - postgres
      - mongo
    environment:
      - APP_ENV=development

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: news_db
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_password
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
      - ./app/migrations:/docker-entrypoint-initdb.d

  mongo:
    image: mongo:6
    command: mongod --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - ./docker/mongo/data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: php-project
